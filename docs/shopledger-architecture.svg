<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title>
<desc id="desc">Browser UI calls Express routes; order creation uses pricing, coupons, tax, inventory, ledger, orders and store. Invoices and GST audit use separate modules.</desc>
<style>text{font:15px system-ui,sans-serif;fill:#14243a}.heading{font-size:28px;font-weight:700}.small{font-size:13px}.box{fill:#eef5ff;stroke:#4875b7;stroke-width:2;rx:12}.data{fill:#fff5dc;stroke:#b88721;stroke-width:2;rx:12}.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#tip)}.title{font-weight:700;font-size:17px}</style>
<defs><marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs>
<text x="40" y="48" class="heading">ShopLedger · architecture and order flow</text>
<rect class="box" x="40" y="100" width="250" height="100"/><text x="62" y="135" class="title">Browser POS / Audit UI</text><text x="62" y="160">public/index.html</text><text x="62" y="182">public/js/app.js · CSS</text>
<rect class="box" x="360" y="100" width="360" height="140"/><text x="382" y="133" class="title">server.js · Express routers</text><text x="382" y="160">routes/orders.js · products.js</text><text x="382" y="183">routes/customers.js · reports.js</text><text x="382" y="209" class="small">POST /orders · GET invoice · GST audit</text>
<rect class="box" x="790" y="100" width="320" height="140"/><text x="812" y="133" class="title">Checkout calculations</text><text x="812" y="160">lib/pricing.js</text><text x="812" y="183">lib/coupons.js · lib/tax.js</text><text x="812" y="209" class="small">HSN slabs · post-discount GST</text>
<rect class="box" x="360" y="305" width="360" height="135"/><text x="382" y="337" class="title">Order and account modules</text><text x="382" y="365">lib/orders.js · lib/inventory.js</text><text x="382" y="390">lib/ledger.js · lib/dates.js</text><text x="382" y="414" class="small">Create order · reserve stock · khata</text>
<rect class="data" x="790" y="315" width="320" height="115"/><text x="812" y="347" class="title">Persistence / settings</text><text x="812" y="375">lib/store.js → data/db.json</text><text x="812" y="401">config.js · tax/coupon definitions</text>
<rect class="box" x="40" y="305" width="250" height="135"/><text x="62" y="337" class="title">Invoice and audit</text><text x="62" y="365">lib/invoice.js</text><text x="62" y="390">lib/reports.js</text><text x="62" y="414" class="small">Invoice vs. stored totals</text>
<path class="arrow" d="M290 150H360"/><path class="arrow" d="M720 155H790"/><path class="arrow" d="M540 240V305"/><path class="arrow" d="M720 370H790"/><path class="arrow" d="M360 370H290"/><path class="arrow" d="M950 240V315"/><path class="arrow" d="M165 200V305"/>
<text x="40" y="495" class="title">Order placement</text>
<text x="40" y="523">UI → POST /orders → inventory check → coupon validation → pricing.computeTotals → khata charge (optional)</text>
<text x="40" y="549">→ inventory reserve → orders.add → store.write(data/db.json).</text>
<text x="40" y="593" class="title">Invoice / reconciliation</text>
<text x="40" y="620">GET invoice or GST audit → invoice.computeInvoiceFigures → reports.getGstReconciliation compares stored order values.</text>
</svg>